name: Build ICARUS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "native/android/**"
      - ".github/workflows/android-build.yml"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prepare account-free wake-word engine
        run: bash native/android/scripts/prepare-sherpa-kws.sh
      - name: Build debug APK
        working-directory: native/android
        env:
          ICARUS_WEB_URL: ${{ vars.ICARUS_WEB_URL || 'https://icarus-wise-guide.base44.app' }}
        run: gradle :app:assembleDebug -PICARUS_WEB_URL="$ICARUS_WEB_URL" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ICARUS-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error