name: Build ICARUS Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "native/android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      ICARUS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ICARUS_UPLOAD_KEYSTORE_BASE64 }}
      ICARUS_KEYSTORE_PASSWORD: ${{ secrets.ICARUS_KEYSTORE_PASSWORD }}
      ICARUS_KEY_ALIAS: ${{ secrets.ICARUS_KEY_ALIAS }}
      ICARUS_KEY_PASSWORD: ${{ secrets.ICARUS_KEY_PASSWORD }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prepare account-free wake-word engine
        run: bash native/android/scripts/prepare-sherpa-kws.sh
      - name: Build debug APK
        working-directory: native/android
        env:
          ICARUS_WEB_URL: https://icarusassistant.com
        run: gradle :app:assembleDebug -PICARUS_WEB_URL="$ICARUS_WEB_URL" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ICARUS-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Decode permanent Play upload key
        if: env.ICARUS_UPLOAD_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$ICARUS_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/icarus-upload.jks"
          chmod 600 "$RUNNER_TEMP/icarus-upload.jks"
      - name: Build signed Google Play bundle
        if: env.ICARUS_UPLOAD_KEYSTORE_BASE64 != ''
        working-directory: native/android
        env:
          ICARUS_KEYSTORE_FILE: ${{ runner.temp }}/icarus-upload.jks
          ICARUS_WEB_URL: https://icarusassistant.com
        run: gradle :app:bundleRelease -PICARUS_WEB_URL="$ICARUS_WEB_URL" --stacktrace
      - name: Upload Google Play internal-test bundle
        if: env.ICARUS_UPLOAD_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ICARUS-1.2.0-play-aab
          path: native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Check for existing immutable release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish permanent APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: ICARUS 1.2.0
          body: ICARUS 1.2.0 test build with voice-loop fixes, unlimited testing access, startup update checks, and versioned patch notes.
          files: native/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
