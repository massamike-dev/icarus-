name: Build ICARUS Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "native/android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prepare account-free wake-word engine
        run: bash native/android/scripts/prepare-sherpa-kws.sh
      - name: Build debug APK
        working-directory: native/android
        env:
          ICARUS_WEB_URL: https://icarusassistant.com
        run: gradle :app:assembleDebug -PICARUS_WEB_URL="$ICARUS_WEB_URL" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ICARUS-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish permanent APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.3
          name: ICARUS 1.1.3
          body: Native Android bridge build with refreshed Base44 frontend and voice controls.
          files: native/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true