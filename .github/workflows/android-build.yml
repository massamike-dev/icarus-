name: Build ICARUS Android

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed Play Store AAB and shareable APK"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - "native/android/**"
      - ".github/workflows/android-build.yml"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Prepare account-free wake-word engine
        run: bash native/android/scripts/prepare-sherpa-kws.sh
      - name: Build and lint API 36 debug app
        working-directory: native/android
        env:
          ICARUS_WEB_URL: ${{ vars.ICARUS_WEB_URL || 'https://icarusassistant.com' }}
        run: |
          gradle :app:lintDebug :app:assembleDebug -PICARUS_WEB_URL="$ICARUS_WEB_URL" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ICARUS-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ICARUS-debug-lint
          path: native/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  signed-play-aab:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ICARUS_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD_B64: ${{ secrets.ICARUS_SIGNING_PASSWORD_BASE64 }}
          KEY_ALIAS: ${{ secrets.ICARUS_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$SIGNING_PASSWORD_B64"
          test -n "$KEY_ALIAS"
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ICARUS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/icarus-upload.jks"
          chmod 600 "$RUNNER_TEMP/icarus-upload.jks"
      - name: Decode and mask signing password
        env:
          SIGNING_PASSWORD_B64: ${{ secrets.ICARUS_SIGNING_PASSWORD_BASE64 }}
        run: |
          SIGNING_PASSWORD="$(printf '%s' "$SIGNING_PASSWORD_B64" | base64 --decode)"
          test -n "$SIGNING_PASSWORD"
          echo "::add-mask::$SIGNING_PASSWORD"
          echo "ICARUS_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "ICARUS_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
      - name: Prepare account-free wake-word engine
        run: bash native/android/scripts/prepare-sherpa-kws.sh
      - name: Build signed Play Store bundle and shareable APK
        working-directory: native/android
        env:
          ICARUS_WEB_URL: ${{ vars.ICARUS_WEB_URL || 'https://icarusassistant.com' }}
          ICARUS_KEYSTORE_FILE: ${{ runner.temp }}/icarus-upload.jks
          ICARUS_KEY_ALIAS: ${{ secrets.ICARUS_KEY_ALIAS }}
        run: |
          gradle :app:lintRelease :app:bundleRelease :app:assembleRelease -PICARUS_WEB_URL="$ICARUS_WEB_URL" --stacktrace
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ICARUS-Play-release-aab
          path: native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ICARUS-shareable-release-apk
          path: native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ICARUS-release-lint
          path: native/android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Publish versioned ICARUS test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CODE="$(awk '$1 == "versionCode" { print $3; exit }' native/android/app/build.gradle.kts)"
          VERSION_NAME="$(awk '$1 == "versionName" { gsub(/"/, "", $3); print $3; exit }' native/android/app/build.gradle.kts)"
          RELEASE_TAG="v${VERSION_NAME}-test"
          RELEASE_DATE="$(date -u +%F)"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/ICARUS-latest.apk"
          export VERSION_CODE VERSION_NAME RELEASE_TAG RELEASE_DATE APK_URL
          cp native/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ICARUS-latest.apk"
          cp native/android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/ICARUS-latest.aab"
          SHA256="$(sha256sum "$RUNNER_TEMP/ICARUS-latest.apk" | cut -d' ' -f1)"
          export SHA256
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          manifest = {
              "versionCode": version_code,
              "versionName": version_name,
              "releaseDate": os.environ["RELEASE_DATE"],
              "downloadUrl": os.environ["APK_URL"],
              "sha256": os.environ["SHA256"],
              "patchNotes": [
                  "Moved the automatic update feed to public GitHub so update checks work without signing in.",
                  f"Updated the signed Android test build to version {version_name} (build {version_code}).",
                  "Kept ICARUS connected to the live Base44 app at icarusassistant.com.",
                  "Preserved signed in-place installation without uninstalling the existing app."
              ]
          }
          Path("public/android-update-v2.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $RELEASE_TAG is already published and immutable."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "ICARUS $VERSION_NAME Test Build" --notes "Signed ICARUS Android test build $VERSION_CODE." --draft
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/ICARUS-latest.apk" "$RUNNER_TEMP/ICARUS-latest.aab" public/android-update-v2.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/android-update-v2.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ICARUS $VERSION_NAME updater manifest [skip ci]"
            git push origin HEAD:main
          fi
