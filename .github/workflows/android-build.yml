name: Build ICARUS Android

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed Play Store AAB"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - "native/android/**"
      - ".github/workflows/android-build.yml"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Prepare account-free wake-word engine
        run: bash native/android/scripts/prepare-sherpa-kws.sh
      - name: Build and lint API 36 debug app
        working-directory: native/android
        env:
          ICARUS_WEB_URL: ${{ vars.ICARUS_WEB_URL || 'https://icarusassistant.com' }}
        run: |
          gradle :app:lintDebug :app:assembleDebug -PICARUS_WEB_URL="$ICARUS_WEB_URL" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ICARUS-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ICARUS-debug-lint
          path: native/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  signed-play-aab:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ICARUS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ICARUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ICARUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ICARUS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ICARUS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/icarus-upload.jks"
          chmod 600 "$RUNNER_TEMP/icarus-upload.jks"
      - name: Prepare account-free wake-word engine
        run: bash native/android/scripts/prepare-sherpa-kws.sh
      - name: Build signed Play Store bundle
        working-directory: native/android
        env:
          ICARUS_WEB_URL: ${{ vars.ICARUS_WEB_URL || 'https://icarusassistant.com' }}
          ICARUS_KEYSTORE_FILE: ${{ runner.temp }}/icarus-upload.jks
          ICARUS_KEYSTORE_PASSWORD: ${{ secrets.ICARUS_KEYSTORE_PASSWORD }}
          ICARUS_KEY_ALIAS: ${{ secrets.ICARUS_KEY_ALIAS }}
          ICARUS_KEY_PASSWORD: ${{ secrets.ICARUS_KEY_PASSWORD }}
        run: |
          gradle :app:lintRelease :app:bundleRelease -PICARUS_WEB_URL="$ICARUS_WEB_URL" --stacktrace
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: ICARUS-Play-release-aab
          path: native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ICARUS-release-lint
          path: native/android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
