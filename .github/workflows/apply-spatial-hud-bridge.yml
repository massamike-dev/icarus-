name: Apply Spatial HUD Bridge Patch

permissions:
  contents: write

on:
  push:
    branches:
      - "feature/spatial-hud-1.4.0"
    paths:
      - ".github/workflows/apply-spatial-hud-bridge.yml"

jobs:
  patch-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spatial-hud-1.4.0
          fetch-depth: 0
      - name: Patch native WebView bridge
        run: python3 scripts/apply_spatial_hud_bridge.py
      - name: Commit bridge patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Bridge patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/android/app/src/main/java/com/icarusalmighty/app/MainActivity.kt
          git commit -m "Wire native spatial HUD into ICARUS bridge"
          git push origin HEAD:feature/spatial-hud-1.4.0
