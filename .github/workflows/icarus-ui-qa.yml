name: ICARUS browser UI checks
on:
  push:
    branches: [work/icarus-xreal-preview-20261014]
  pull_request:
    paths: ['web/**', '.github/workflows/icarus-ui-qa.yml']
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --include=dev
        working-directory: web
      - run: npm run build -- --base=./
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: node scripts/visual-smoke.mjs
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icarus-browser-ui-${{ github.sha }}
          path: web/ui-qa/
          if-no-files-found: error
          retention-days: 14
