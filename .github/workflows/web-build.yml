name: ICARUS Web Build
on:
  push:
    branches: [main, web-migration]
    paths: ['web/**','.github/workflows/web-build.yml']
  pull_request:
    paths: ['web/**','.github/workflows/web-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
